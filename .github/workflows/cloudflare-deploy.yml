name: Deploy to Cloudflare

# Builds the NetBox container image, extracts the static assets and deploys the
# Worker + containers defined in deploy/cloudflare/. See deploy/cloudflare/PLAN.md.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   token with Workers Scripts:Edit, Containers:Edit,
#                          Workers R2 Storage (if used) and Account Settings:Read
#   CLOUDFLARE_ACCOUNT_ID  the target account
# Runtime secrets (SECRET_KEY, DATABASE_URL, ...) are set once with
# `wrangler secret put` and are not touched by this workflow.

on:
  push:
    branches: [master]
    paths:
      - 'netbox/**'
      - 'requirements.txt'
      - 'base_requirements.txt'
      - 'deploy/cloudflare/**'
      - '.dockerignore'
      - '.github/workflows/cloudflare-deploy.yml'
  workflow_dispatch:
    inputs:
      rollout:
        description: Container rollout strategy
        type: choice
        default: gradual
        options: [gradual, immediate, none]

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare
    defaults:
      run:
        working-directory: deploy/cloudflare
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Worker dependencies
        run: npm ci

      - name: Typecheck Worker
        run: npm run typecheck

      - name: Build image and extract static assets
        run: ./collectstatic.sh

      - name: Deploy Worker and containers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --containers-rollout "${{ inputs.rollout || 'gradual' }}"
